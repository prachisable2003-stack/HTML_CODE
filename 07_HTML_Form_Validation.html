<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="firstName">First Name:</label>
        <input type="text" 
        id="firstName" 
        name="firstName"
        required
        minlength="3"
        maxlength="12"
        pattern="[a-z]{5}" >

        <br><br>

        <label for="age">Age:</label>
        <input type="number"
         id="age"
         name="age"
         required
         min="0"
         max="150" >

         <br><br>

          <label for="email">Email Address:</label>
          <input type="email" 
          id="email" 
          name="email"
          required
          
          >





        <input type="submit" id="submit" name="submit">
    </form>
</body>
</html>
