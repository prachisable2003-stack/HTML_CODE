<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Text</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zeyada&display=swap" rel="stylesheet">
    <style>
        *{
            padding:0;
            margin:0;
            box-sizing:border-box;
        }
        .box{
            width:500px;
            height:500px;
            border:2px solid black;
            background-color: aqua;
            text-align: left;
            color:black;
            word-spacing:5px;
            letter-spacing:1px;
            font-size:16px;
            font-weight: 900;
            font-family:"Zeyada", cursive;
            line-height: 100px;
            overflow: auto;
            text-transform: uppercase;
            text-decoration:underline ;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt esse in sunt! Repellendus explicabo maxime tempore aperiam consectetur minima ex? Pariatur sunt expedita assumenda incidunt totam voluptate nulla asperiores reprehenderit!</p>
    </div>

</body>
</html>
