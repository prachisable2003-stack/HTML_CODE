<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tables</title>
    <style>
        /*table ,tr,th,td{
            border:1px solid black;
            border-collapse: collapse;


        }*/
        table{
            width:100%;
        }
        td{
            text-align: center;
            padding:20px;
        }
        th{
             padding:20px;
        }
        tr:first-child{
            background-color:black;
            color:white;
        }
        
        tr:nth-child(odd){
            background-color: grey;
        }
        tr:nth-child(3){
            background-color: grey;
        }
         tr:nth-child(5){
            background-color: grey;
        }

    </style>
</head>
<body>
    <table>
       <tr>
        <th>Name</th>
        <th>Gender</th>
        <th>City</th>
       </tr>
       <tr>
        <td>Ram</td>
        <td>Male</td>
        <td>pune</td>
       </tr>
   
       <tr>
        <td>shyam</td>
        <td>Male</td>
        <td>mumbai</td>
       </tr>

        <tr>
        <td>Geeta</td>
        <td>female</td>
        <td>thane</td>
       </tr>


        <tr>
        <td>prachi</td>
        <td>female</td>
        <td>banaras</td>
       </tr>


    </table>
</body>
</html>
