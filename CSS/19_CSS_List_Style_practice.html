<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .Fruits{
           border:1px solid black;
           list-style-type:square;
        
         }
         .Fruits li{
            border:1px solid black;
         }
        
         .Subjects{
            border:1px solid black;
            list-style-type:upper-alpha;
         }
         .Subjects li{
            border:1px solid black;
         }
         .Programming-languages{
             border:1px solid black;
            list-style-type:lower-roman;
         }
         .Programming-languages li{
            border:1px solid black;
         }
         
         
    </style>
</head>
<body>
     <h3>Fruits:</h3>
     <ul class="Fruits">
        <li>mango</li>
        <li>Orange</li>
        <li>pomgrant</li>
        <li>sweet lime</li>
     </ul>
      <h3>Subjects:</h3>
     <ul class="Subjects">
        <li>Mathematics</li>
        <li>Hindi</li>
        <li>English</li>
        <li>History</li>
   
     </ul>
     <h3>Programming Languages:</h3>
       <ul class="Programming-languages">
        <li>java</li>
        <li>Dot Net</li>
        <li>Frontend</li>
        <li>DSA</li>
       </ul> 
       
   
</body>
</html>
