<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS pseudo classes</title>
    <style>
        button{
            background-color:green;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;

        }
        button:hover{
            background-color: red;
        }
        a{
            text-decoration: green;

        }
        a:link{

            color:blueviolet
        }
        a:visited{
            color: blueviolet;
        }
        a:hover{
            color:dimgray;
        }
        
    </style>
</head>
<body>
    <button>Submit</button>
    <a href="http:/www.google.com">Google</a>
    <a href="./mini project of business intelligence (1).pdf" download="First PDF.pdf">Download pdf</a>
</body>
</html>
