<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        *{
            padding:0;
            margin:0;
            box-sizing:border-box;
        }
        #box1{
              border-style:solid;
              border-width: 10px;
              border-color:red;
              border:10px solid red;
              border-top: 10px solid red;
              border-right: 20px dashed green;
              border-bottom:30px dotted pink;
              border-left:40px double brown;
              border-radius: 50px;
              width:400px;
              height:400px;
              padding:80px;
              /*padding:40px 50px;
              padding:10px 20px 30px 40px;*/
              margin:30px;
        }
    </style>
</head>
<body>
    <div id="box1">Box 1</div>
</body>
</html>
