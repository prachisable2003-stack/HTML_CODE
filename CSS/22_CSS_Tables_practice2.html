<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width:100%;
            text-align:center;
            border-collapse: collapse;
        }
        th{
            background-color:darkgreen;
            color:white;
             border:1px solid black;
             padding:10px;
        }
        td{
            border:1px solid black;
            padding:10px;
        }
        tr:nth-child(odd){
            background-color:lightgrey;
        }
        tr:nth-child(even){
            background-color:white;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>category</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>50000</td>
            <td>Electronics</td>
            <td>Available</td>
        </tr>
         <tr>
            <td>Headphone</td>
            <td>2000</td>
            <td>Accerrious</td>
            <td>Available</td>
        </tr>
         <tr>
            <td>Keyboard</td>
            <td>1500</td>
            <td>Accerrious</td>
            <td>Out of stock</td>
        </tr>
         <tr>
            <td>Mobile</td>
            <td>20000</td>
            <td>Electronics</td>
            <td>Available</td>
        </tr>
         <tr>
            <td>Mouse</td>
            <td>500</td>
            <td>Accerrious</td>
            <td>out of stock</td>
        </tr>
    </table>
</body>
</html>
