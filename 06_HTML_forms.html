<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application form</title>
    <style>
</style>
</head>
<body>
    <marquee><h1>GATE Computer Science and Information Technology</h1></marquee>
    <br><br><br>
    <h1> Application form</h1>

    <form enctype="multipart/form-data">
            
   <label for="firstName">First Name:</label>
   <input type="text" id="firstName">

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName">

    <br>
    <br>

    <label for="dateOfBirth">Date of Birth</label>
    <input type="date" id="dateOfBirth">

    <label for="age">Age:</label>
    <input type="number" id="age">

    <br>
    <br>

    <label for="gender">Gender:</label>
    <select name="gender" id="gender">
        <option value="male">Male</option>
         <option value="female">Female</option>
          <option value="other">Other</option>
          </select>

          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email">

          <br>
          <br>

          Position Available:
          <input
          type="radio"
          value="junior Developer"
          name="positionsAvailabel"
          id="juniorDeveloper">

          <label for="juniorDeveloper">Junior Developer:</label>


          <input
          type="radio"
          value="mid-level Developer"
          name="positionsAvailabel"
          id="mid-level Developer">

          <label for="mid-levelDeveloper">Mid-Level Developer</label>

          <input
          type="radio"
          value="Senior Developer"
          name="positionsAvailabel"
          id="Senior Developer">

          <label for="Senior Developer">Senior Developer</label>

          <br><br>

          Programming Languages:
          <input
          type="checkbox"
          value="java"
          name="language"
          id="java">

          <label for="java">Java</label>


          <input
          type="checkbox"
          value="javascript"
          name="language"
          id="javascript">

          <label for="javascript">Javascript</label>


          <input
          type="checkbox"
          value="python"
          name="language"
          id="python">

          <label for="python">Python</label>

          <br><br>

          <label for="password">Password</label>
          <input type="password" id="password" name="password">

          <label for="confirm password">Confirm Password</label>
          <input type="password" id="confirm password" name="confirm pssword">

          <br>
          <br>

          <label for="">Tell me about your self:</label>
          <textarea name="Tell me about yourself" id="Tell me about yourself" cols="100"
          rows="5">Tell me about yourself</textarea>

          <br><br>
          <label for="profilePicture">Profile Picture:</label>
          <input type="file" id="profilePicture" name="profilePicture">

          <br><br>

          <input type="hidden" value="Application form" name="Application form">

          <input type="submit" id="submit" name="submit">
    
    </form>
    
</body>
</html>
